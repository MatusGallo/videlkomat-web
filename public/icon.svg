<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 170) rotate(52) scale(430)">
      <stop stop-color="#FF9C4E"/>
      <stop offset="1" stop-color="#DD5809"/>
    </radialGradient>
    <linearGradient id="body" x1="256" y1="150" x2="256" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F3ECE0"/>
      <stop offset="1" stop-color="#DED2C0"/>
    </linearGradient>
    <linearGradient id="cab" x1="376" y1="205" x2="376" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#E4D8C6"/>
    </linearGradient>
    <linearGradient id="base" x1="256" y1="300" x2="256" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9CCB8"/>
      <stop offset="1" stop-color="#B9A98F"/>
    </linearGradient>
    <radialGradient id="tire" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 -14) scale(48)">
      <stop offset=".55" stop-color="#3A3A40"/>
      <stop offset="1" stop-color="#141417"/>
    </radialGradient>
    <radialGradient id="hub" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(-5 -6) scale(24)">
      <stop stop-color="#FDFDFD"/>
      <stop offset="1" stop-color="#A9AEB5"/>
    </radialGradient>
    <linearGradient id="glass" x1="360" y1="225" x2="405" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCF1FF"/>
      <stop offset="1" stop-color="#7FB4E0"/>
    </linearGradient>
    <radialGradient id="floor" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 410) scale(175 30)">
      <stop stop-color="#3A1600" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3A1600" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- kontaktní stín -->
  <ellipse cx="256" cy="410" rx="175" ry="30" fill="url(#floor)"/>

  <!-- podvozek -->
  <rect x="120" y="300" width="300" height="46" rx="16" fill="url(#base)"/>

  <!-- kola -->
  <g>
    <circle cx="192" cy="358" r="46" fill="url(#tire)"/>
    <circle cx="192" cy="358" r="21" fill="url(#hub)"/>
    <circle cx="192" cy="358" r="7" fill="#7C818A"/>
    <circle cx="352" cy="358" r="46" fill="url(#tire)"/>
    <circle cx="352" cy="358" r="21" fill="url(#hub)"/>
    <circle cx="352" cy="358" r="7" fill="#7C818A"/>
  </g>

  <!-- ambientní stín pod převisem korby/kabiny (schovaný pod tělem) -->
  <ellipse cx="238" cy="315" rx="104" ry="15" fill="#3A1600" opacity=".18"/>

  <!-- korba -->
  <rect x="116" y="150" width="212" height="168" rx="28" fill="url(#body)"/>
  <!-- levá boční plocha (objem) -->
  <path d="M116 178 q0-28 28-28 h6 v168 h-6 q-28 0-28-28 Z" fill="#000000" opacity=".05"/>
  <!-- horní lesk (měkký, oválný) -->
  <ellipse cx="205" cy="182" rx="92" ry="20" fill="#FFFFFF" opacity=".55"/>
  <!-- dveře / linka -->
  <rect x="214" y="170" width="4" height="140" rx="2" fill="#C9BBA4" opacity=".65"/>
  <!-- spodní vnitřní stín korby -->
  <rect x="128" y="300" width="188" height="16" rx="8" fill="#B39C7E" opacity=".4"/>

  <!-- kabina -->
  <path d="M328 214 q0-14 14-14 h44 q10 0 16 8 l18 24 q4 6 4 14 v58 q0 14-14 14 H328 Z" fill="url(#cab)"/>
  <!-- stín kabiny při korbě -->
  <rect x="328" y="214" width="12" height="104" fill="#000000" opacity=".06"/>
  <!-- okno -->
  <path d="M360 224 h28 q7 0 11 6 l13 17 q3 4 3 9 v4 q0 7-7 7 h-51 q-7 0-7-7 v-36 q0-7 7-7 Z" fill="url(#glass)"/>
  <!-- lesk okna -->
  <path d="M368 230 h10 l-18 30 h-6 v-18 q0-12 14-12 Z" fill="#FFFFFF" opacity=".4"/>
  <!-- světlo -->
  <rect x="411" y="290" width="12" height="20" rx="5" fill="#FFD86B"/>
  <ellipse cx="417" cy="296" rx="4" ry="5" fill="#FFF0B8"/>

  <!-- horní rim light přes korbu i kabinu -->
  <path d="M144 151 h170 M342 201 h44" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".5"/>
</svg>
